name: Build-ChessFish

on:
  push:
    branches: [main]
    paths-ignore:
      - 'testimgs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report started
        run: |
          git config user.email "actions@github.com"
          git config user.name "actions"
          echo "started ${GITHUB_SHA} at $(date -u '+%F %T')" > ci_status.txt
          git checkout -b ci-status 2>/dev/null || (git fetch origin ci-status && git checkout ci-status) || git checkout -b ci-status
          echo "started ${GITHUB_SHA} at $(date -u '+%F %T')" > ci_status.txt
          git add ci_status.txt
          git commit -m "ci: started" || true
          git push -f origin ci-status
          git checkout main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Build release APKs (both flavors)
        run: |
          set +e
          ./gradlew assembleArmv8-Release assembleArmv8-dotprod-Release --stacktrace > build.log 2>&1
          rc=$?
          tail -c 6000 build.log > ci_status.txt
          echo "" >> ci_status.txt
          echo "gradle_exit=$rc" >> ci_status.txt
          git config user.email "actions@github.com"
          git config user.name "actions"
          git checkout -b ci-status 2>/dev/null || (git fetch origin ci-status && git checkout ci-status) || git checkout -b ci-status
          git add ci_status.txt
          git commit -m "ci: gradle_exit=$rc"
          git push -f origin ci-status
          exit $rc

      - name: Stage release artifacts
        run: |
          mkdir -p release-staging
          cp app/build/outputs/apk/armv8-/release/*.apk release-staging/ || true
          cp app/build/outputs/apk/armv8-dotprod-/release/*.apk release-staging/ || true
          ls -la release-staging/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChessFish-apks
          if-no-files-found: error
          path: release-staging

      - name: Mirror APKs to apk branch
        run: |
          git config user.email "actions@github.com"
          git config user.name "actions"
          git fetch origin apk || true
          git branch -f apk origin/apk 2>/dev/null || git branch apk
          git checkout apk
          rm -f ChessFish_*.apk 2>/dev/null || true
          cp release-staging/*.apk .
          git add -A
          git commit -m "apk: ${GITHUB_SHA}"
          git push -f origin apk:apk
