name: Build-ChessFish

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'testimgs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Build release APKs (both flavors)
        run: ./gradlew assembleArmv8-Release assembleArmv8-dotprod-Release --stacktrace

      - name: Stage release artifacts
        run: |
          mkdir -p release-staging
          cp app/build/outputs/apk/armv8-/release/*.apk release-staging/ || true
          cp app/build/outputs/apk/armv8-dotprod-/release/*.apk release-staging/ || true
          ls -la release-staging/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChessFish-apks
          if-no-files-found: error
          path: release-staging

      - name: Mirror APKs to apk branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "actions"
          git fetch origin apk || true
          git branch -f apk origin/apk 2>/dev/null || git branch apk
          git checkout apk
          rm -f app-debug.apk* ChessFish_*.apk 2>/dev/null || true
          cp release-staging/*.apk .
          git add -A
          git commit -m "apk: ${GITHUB_SHA}" || true
          git push -f origin apk:apk
