name: android-build

on:
  push:
    paths: ["assistant/**", ".github/workflows/android-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: assistant
        run: gradle :app:assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        working-directory: assistant
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xiangqiscan-debug
          path: assistant/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: xiangqiscan-release-unsigned
          path: assistant/app/build/outputs/apk/release/app-release-unsigned.apk
